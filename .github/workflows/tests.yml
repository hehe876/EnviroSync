name: Fullstack offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Backend tests (no AWS keys)
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: milestones/milestone_3_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Run npm install until the first install generates milestones/milestone_3_frontend/package-lock.json.
      # Commit that lockfile, then change to `npm ci` for deterministic CI installs.
      - name: Install React dependencies
        run: npm install
      - name: Browser-independent frontend tests
        run: npm run test
      - name: Vite production build
        run: npm run build
